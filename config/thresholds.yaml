# Verdict boundaries on the fused 0-1 tamper score.
# Requires 0 <= authentic_upper_bound <= likely_tampered_lower_bound <= 1.
#   score <  authentic_upper_bound         -> "authentic"
#   score <  likely_tampered_lower_bound   -> "suspicious"
#   otherwise                              -> "likely_tampered"
authentic_upper_bound: 0.35
likely_tampered_lower_bound: 0.70
